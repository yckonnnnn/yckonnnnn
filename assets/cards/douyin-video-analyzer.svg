<svg width="640" height="320" viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="抖音爆款分析平台">
  <style>
    .card { fill: #0d1117; }
    .card-stroke { stroke: #30363d; stroke-width: 2; }
    .title { font: 700 34px -apple-system, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif; fill: #e6edf3; }
    .desc { font: 400 21px -apple-system, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif; fill: #9198a1; }
    .tech { font: 600 16px 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; fill: #22d3ee; letter-spacing: 1px; }
    .repo { font: 400 17px 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; fill: #6e7681; }
    @media (prefers-color-scheme: light) {
      .card { fill: #ffffff; }
      .card-stroke { stroke: #d0d7de; }
      .title { fill: #1f2328; }
      .desc { fill: #59636e; }
      .repo { fill: #8c959f; }
    }
  </style>
  <defs>
    <linearGradient id="ig" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <clipPath id="cardClip"><rect x="1" y="1" width="638" height="318" rx="16"/></clipPath>
  </defs>
  <rect x="1" y="1" width="638" height="318" rx="16" class="card"/>
  <g clip-path="url(#cardClip)">
    <circle cx="640" cy="-40" r="220" fill="#22d3ee" opacity="0.07"/>
    <circle cx="40" cy="360" r="200" fill="#0284c7" opacity="0.07"/>
  </g>
  <rect x="1" y="1" width="638" height="318" rx="16" fill="none" class="card-stroke"/>
  <rect x="48" y="88" width="144" height="144" rx="32" fill="url(#ig)"/>
  
  <g transform="translate(48,88)">
    <rect x="40" y="28" width="112" height="80" rx="20" fill="#ffffff"/>
    <path d="M 88 52 L 120 68 L 88 84 Z" fill="#111"/>
    <path d="M 132 24 c 6 10 2 20 -6 26 M 144 16 c 8 14 3 28 -8 36" fill="none" stroke="#25f4ee" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="228" y="132" class="repo">yckonnnnn / douyin-video-analyzer</text>
  <text x="228" y="182" class="title">抖音爆款分析平台</text>
  <text x="228" y="226" class="desc">Playwright 采集 · LLM 文案拆解</text>
  <text x="228" y="286" class="tech">REACT · TRPC · PLAYWRIGHT</text>
