<svg width="640" height="320" viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DeepTrading AI">
  <style>
    .card { fill: #0d1117; }
    .card-stroke { stroke: #30363d; stroke-width: 2; }
    .title { font: 700 34px -apple-system, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif; fill: #e6edf3; }
    .desc { font: 400 21px -apple-system, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif; fill: #9198a1; }
    .tech { font: 600 16px 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; fill: #84cc16; letter-spacing: 1px; }
    .repo { font: 400 17px 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; fill: #6e7681; }
    @media (prefers-color-scheme: light) {
      .card { fill: #ffffff; }
      .card-stroke { stroke: #d0d7de; }
      .title { fill: #1f2328; }
      .desc { fill: #59636e; }
      .repo { fill: #8c959f; }
    }
  </style>
  <defs>
    <linearGradient id="ig" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#84cc16"/><stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <clipPath id="cardClip"><rect x="1" y="1" width="638" height="318" rx="16"/></clipPath>
  </defs>
  <rect x="1" y="1" width="638" height="318" rx="16" class="card"/>
  <g clip-path="url(#cardClip)">
    <circle cx="640" cy="-40" r="220" fill="#84cc16" opacity="0.07"/>
    <circle cx="40" cy="360" r="200" fill="#16a34a" opacity="0.07"/>
  </g>
  <rect x="1" y="1" width="638" height="318" rx="16" fill="none" class="card-stroke"/>
  <rect x="48" y="88" width="144" height="144" rx="32" fill="url(#ig)"/>
  
  <g transform="translate(48,88)">
    <line x1="72" y1="16" x2="72" y2="30" stroke="#e6edf3" stroke-width="4" stroke-linecap="round"/>
    <rect x="60" y="30" width="24" height="38" rx="4" fill="#16a34a"/>
    <line x1="72" y1="68" x2="72" y2="80" stroke="#e6edf3" stroke-width="4" stroke-linecap="round"/>
    <line x1="104" y1="42" x2="104" y2="56" stroke="#e6edf3" stroke-width="4" stroke-linecap="round"/>
    <rect x="92" y="56" width="24" height="44" rx="4" fill="#ef4444"/>
    <line x1="104" y1="100" x2="104" y2="114" stroke="#e6edf3" stroke-width="4" stroke-linecap="round"/>
    <line x1="136" y1="26" x2="136" y2="40" stroke="#e6edf3" stroke-width="4" stroke-linecap="round"/>
